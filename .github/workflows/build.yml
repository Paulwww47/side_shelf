name: build

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    name: Windows x64 · MSVC · Qt 6
    runs-on: windows-2022
    env:
      QT_VERSION: '6.9.3'
    steps:
      - name: 检出
        uses: actions/checkout@v4

      # runner 的 PATH 上存在 C:\mingw64，若不先建立 MSVC 环境并显式指定
      # 编译器，CMake 会选中 MinGW g++，随后去链接 MSVC 构建的 Qt，
      # 以 ABI 不匹配（undefined reference）告终。
      - name: 配置 MSVC 环境
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 安装 Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true

      - name: 配置
        run: cmake -S cpp -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl

      - name: 构建
        run: cmake --build build

      # 注意：本项目的自检（--selftest）会校验透明窗口属性、屏幕边缘几何与
      # 剪贴板往返，需要真实的交互式桌面会话，在无头 runner 上并不可靠，
      # 因此不纳入 CI。请在本地 Windows 桌面上执行：
      #     side_shelf.exe --selftest
