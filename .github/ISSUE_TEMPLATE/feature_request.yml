name: 功能建议
description: 提出新功能或行为改进建议
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        本程序刻意保持「退出即清空、只做临时中转」的定位，
        与剪贴板历史管理器不同。建议请围绕这一前提展开。

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的场景
      description: 描述当前的不便，而不是直接给出实现方案
      placeholder: 当我……的时候，不得不……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的改进
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 选填。包括你目前是怎么绕开这个问题的
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 issue，没有重复建议
          required: true
