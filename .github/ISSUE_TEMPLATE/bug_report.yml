name: 缺陷报告
description: 报告可复现的程序缺陷
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。提交前请先确认你使用的是
        [最新发布版](https://github.com/Paulwww47/side_shelf/releases/latest)，
        并已阅读 README 的「操作说明」与「行为约定」两节。

  - type: input
    id: version
    attributes:
      label: 程序版本
      description: 见发布包文件名或 Release 标签
      placeholder: 1.0.0
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows 版本
      placeholder: Windows 11 24H2 (26100)
    validations:
      required: true

  - type: dropdown
    id: display
    attributes:
      label: 显示环境
      options:
        - 单显示器
        - 多显示器（含不同 DPI 缩放）
        - 远程桌面 / 虚拟机（无 GPU）
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 复制一张图片到剪贴板
        2. 点击侧边栏把手
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: 提交前确认
      options:
        - label: 我已确认该问题在最新版本上仍然存在
          required: true
        - label: 我已搜索过现有 issue，没有重复
          required: true
